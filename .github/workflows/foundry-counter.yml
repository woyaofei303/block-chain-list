name: Foundry Counter

permissions: {}

on:
  push:
    paths:
      - "foundry-counter/**"
      - ".github/workflows/foundry-counter.yml"
  pull_request:
    paths:
      - "foundry-counter/**"
      - ".github/workflows/foundry-counter.yml"
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: foundry-counter
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
