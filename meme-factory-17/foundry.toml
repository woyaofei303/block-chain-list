[profile.default]
src = "src"
test = "test"
out = "../output-tdd/meme-factory-17/out"
cache_path = "../output-tdd/meme-factory-17/cache"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# 保留测试中的真实 CREATE；动态测试链接会把 new 替换为不计部署 Gas 的 cheatcode。
dynamic_test_linking = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 256
