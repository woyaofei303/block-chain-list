# 仅供独立本地演示；不连接现有数据库，不暴露到局域网。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: graph
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U graph]
      interval: 2s
      retries: 30
  ipfs:
    image: ipfs/kubo:v0.32.1
    ports:
      - '127.0.0.1:15001:5001'
    volumes:
      - ipfs:/data/ipfs
  graph-node:
    image: graphprotocol/graph-node:v0.45.0
    ports:
      - '127.0.0.1:18000:8000'
      - '127.0.0.1:18020:8020'
      - '127.0.0.1:18030:8030'
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    environment:
      postgres_host: postgres
      postgres_user: graph
      postgres_pass: local-demo-only
      postgres_db: graph
      ipfs: ipfs:5001
      ethereum: local:http://host.docker.internal:18545
      GRAPH_LOG: info
    extra_hosts:
      - 'host.docker.internal:host-gateway'
volumes:
  postgres:
  ipfs:
