specVersion: 1.0.0
description: NFTMarket listing and sale history
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: NFTMarket
    network: sepolia
    source:
      address: '0x0000000000000000000000000000000000000000'
      abi: NFTMarket
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - List
        - Sold
        - ActiveListing
      abis:
        - name: NFTMarket
          file: ./abis/NFTMarket.json
        - name: ERC721
          file: ./abis/ERC721.json
      eventHandlers:
        - event: NFTListed(indexed address,indexed uint256,uint256)
          handler: handleListed
        - event: NFTSold(indexed address,indexed address,indexed uint256,uint256)
          handler: handleSold
      file: ./src/mapping.ts
