[profile.default]
src = "src"
test = "test"
script = "script"
out = "../output-tdd/staking-pool-27/out"
cache_path = "../output-tdd/staking-pool-27/cache"
broadcast = "../output-tdd/staking-pool-27/broadcast"
libs = ["../foundry-counter-09/lib"]
auto_detect_remappings = false
remappings = [
    "forge-std/=../foundry-counter-09/lib/forge-std/src/",
    "@openzeppelin/contracts/=../foundry-counter-09/lib/openzeppelin-contracts/contracts/"
]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256
