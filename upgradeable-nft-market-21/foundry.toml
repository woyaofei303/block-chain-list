[profile.default]
src = "src"
test = "test"
script = "script"
out = "../output-tdd/upgradeable-nft-market-21/out"
cache_path = "../output-tdd/upgradeable-nft-market-21/cache"
broadcast = "../output-tdd/upgradeable-nft-market-21/broadcast"
libs = ["lib", "../foundry-counter-09/lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=../foundry-counter-09/lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
]

[profile.default.fuzz]
runs = 256
